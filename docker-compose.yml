services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yourwriter
      POSTGRES_PASSWORD: yourwriter
      POSTGRES_DB: yourwriter
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourwriter -d yourwriter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: dev-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./agents:/app/agents
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://yourwriter:yourwriter@db:5432/yourwriter
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: dev-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8001/api
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  pg_data:
