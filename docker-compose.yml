services:
  backend:
    build:
      context: .
      target: dev-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./agents:/app/agents
      - ./data:/app/data
    env_file: .env
    environment:
      ENVIRONMENT: development

  frontend:
    build:
      context: .
      target: dev-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8001/api
    depends_on:
      - backend

volumes:
  frontend_node_modules:
